name: Auto Sync Loyverse Catalog

on:
  schedule:
    # Run automatically every 10 minutes
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI with 1 click

jobs:
  sync-loyverse:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Run Direct Loyverse POS Synchronizer
        run: node sync_loyverse.js

      - name: Commit and Push Changes if Catalog Updated
        run: |
          git config --global user.name "UrbanNoise AutoSync Bot"
          git config --global user.email "bot@urbannoise.cc"
          git add catalogo/loyverse_products.json loyverse_products.json catalogo/loyverse_preview.html loyverse_preview.html
          if git diff --staged --quiet; then
            echo "No changes detected in Loyverse catalog. Everything is up to date."
          else
            git commit -m "🤖 Auto-sync: Updated Loyverse catalog, images & inventory [skip ci]"
            git push origin master
            echo "✅ Successfully synced and pushed updated catalog to GitHub!"
          fi
